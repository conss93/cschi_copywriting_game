<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카피퀘스트: 글빨골목</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 인트로 -->
  <section id="intro-screen" class="fullscreen hidden">
    <div id="intro-text"></div>
    <p id="intro-hint">클릭해서 넘기기</p>
  </section>

  <!-- 캐릭터 선택 -->
  <div id="charselect-modal" class="modal hidden">
    <div class="modal-box">
      <h2>당신은 누구인가요?</h2>
      <input id="input-name" type="text" maxlength="10" placeholder="이름 (필명도 좋아요)" />
      <div class="char-row">
        <div class="char-card" data-preset="playerA">
          <canvas width="64" height="72"></canvas>
          <p>스타일 A</p>
        </div>
        <div class="char-card" data-preset="playerB">
          <canvas width="64" height="72"></canvas>
          <p>스타일 B</p>
        </div>
      </div>
      <button id="btn-charselect-ok" class="btn primary">글빨골목으로 이사하기</button>
    </div>
  </div>

  <!-- 게임 화면 -->
  <main id="game-wrap" class="hidden">
    <header id="hud">
      <div class="hud-left">
        <span id="hud-name"></span>
        <span id="hud-level"></span>
        <div class="hud-xp"><div id="hud-xp-fill"></div></div>
      </div>
      <div class="hud-right">
        <span id="hud-quest"></span>
        <span id="hud-points"></span>
        <span id="hud-ai" title="채점 방식"></span>
        <button id="btn-medals" class="hud-btn" title="업적 메달">🏅</button>
        <button id="btn-settings" class="hud-btn" title="설정 (API 키)">⚙️</button>
        <button id="btn-reset" class="hud-btn" title="처음부터">↺</button>
      </div>
    </header>

    <div id="canvas-holder">
      <canvas id="game-canvas" width="768" height="512"></canvas>

      <!-- 대화창 -->
      <div id="dialogue" class="hidden">
        <p id="dlg-name"></p>
        <p id="dlg-text"></p>
        <div id="dlg-menu"></div>
      </div>
    </div>

    <!-- 모바일 컨트롤 -->
    <div id="touch-controls">
      <div id="dpad">
        <button id="pad-up">▲</button>
        <div class="dpad-mid">
          <button id="pad-left">◀</button>
          <button id="pad-right">▶</button>
        </div>
        <button id="pad-down">▼</button>
      </div>
      <button id="pad-action">A</button>
    </div>
  </main>

  <!-- 퀘스트 -->
  <div id="quest-modal" class="modal hidden">
    <div class="modal-box wide">
      <h2 id="q-title"></h2>
      <p id="q-npc" class="modal-sub"></p>
      <div id="q-form">
        <p id="q-briefing" class="briefing"></p>
        <p class="mission-label">📌 미션</p>
        <p id="q-mission"></p>
        <div id="q-hint-box" class="hint-box hidden"></div>
        <textarea id="q-input" placeholder="여기에 카피를 작성하세요…"></textarea>
        <p class="count-row"><span id="q-count">0자</span></p>
        <div class="btn-row">
          <button id="q-btn-coffee" class="btn secondary"></button>
          <button id="q-btn-submit" class="btn primary">제출하기</button>
          <button id="q-btn-close" class="btn ghost">닫기</button>
        </div>
      </div>
      <div id="q-result" class="hidden"></div>
    </div>
  </div>

  <!-- 상점 -->
  <div id="shop-modal" class="modal hidden">
    <div class="modal-box wide">
      <h2>🏪 편의점 카피24</h2>
      <p class="modal-sub">보유 포인트: <span id="shop-points"></span></p>
      <div id="shop-list"></div>
      <button id="btn-shop-close" class="btn ghost">나가기</button>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h2>⚙️ 설정</h2>
      <p class="modal-sub">Claude API 키를 넣으면 NPC들이 진짜 AI로 대화하고, 당신의 카피를 첨삭·채점해줍니다.</p>
      <input id="input-apikey" type="password" placeholder="sk-ant-..." />
      <p id="apikey-status" class="status-text"></p>
      <p class="fine-print">
        키는 이 브라우저의 localStorage에만 저장되며 어떤 서버로도 전송되지 않습니다 (Anthropic API 호출 제외).
        키 발급: <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a>
      </p>
      <div class="btn-row">
        <button id="btn-apikey-save" class="btn primary">저장 & 연결 테스트</button>
        <button id="btn-settings-close" class="btn ghost">닫기</button>
      </div>
    </div>
  </div>

  <!-- 메달 -->
  <div id="medals-modal" class="modal hidden">
    <div class="modal-box wide">
      <h2>🏅 업적 메달</h2>
      <div id="medal-grid"></div>
      <button id="btn-medals-close" class="btn ghost">닫기</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
